<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1d1b18; --muted:#6b665d; --line:#e4dfd4;
  --accent:#d1495b; --accent-ink:#fff; --ok:#2f7d4f; --ok-bg:#e6f3ea; --bad:#b33a3a; --bad-bg:#f8e5e3;
  --chip:#efe9dd; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312; --panel:#1d1c1a; --ink:#eeeae2; --muted:#a39d92; --line:#33302b;
  --accent:#ef6b7c; --accent-ink:#1a0d0f; --ok:#6cc18e; --ok-bg:#1d3326; --bad:#f08a8a; --bad-bg:#3a2020;
  --chip:#2a2824; --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-wrap:anywhere}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.logo{font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.file{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1400px;margin:0 auto;padding:24px}
.drop{max-width:640px;margin:8vh auto;text-align:center;background:var(--panel);border:2px dashed var(--line);border-radius:20px;padding:56px 40px;box-shadow:var(--shadow)}
.drop.over{border-color:var(--accent)}
.drop h1{margin:0 0 16px;font-size:32px;line-height:1.5;text-wrap:balance}
.drop p{color:var(--muted);margin:0 auto 28px;max-width:520px;line-height:1.8;text-wrap:pretty}
.drop .muted{margin-top:14px!important;line-height:1.7}
.status{margin-top:16px;color:var(--muted);font-size:15px}
.status:empty{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:24px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:1fr} .viewer:not(.hide){position:static!important;height:70vh!important}}
@media (max-width:640px){
  header{flex-wrap:wrap;gap:10px;padding:12px 14px}
  .file{flex:1 1 100%;order:3}
  main{padding:14px}
  .drop{margin:4vh auto}
  .card{padding:16px}
}
@media (max-width:600px){.drop{padding:36px 20px} .drop h1{font-size:26px}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:0;background:none;padding:10px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:18px}
.card ul{margin:6px 0 0;padding-left:20px}
.chip{display:inline-block;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:13px;margin:2px 4px 2px 0;white-space:nowrap}
button.chip:hover{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
.tscroll{overflow-x:auto}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:600}
td:last-child{width:1%;white-space:nowrap;text-align:right}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.q{margin-bottom:6px;font-weight:600}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.right{background:var(--ok-bg);border-color:var(--ok)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice:disabled{cursor:default}
.explain{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.quote{border-left:3px solid var(--accent);padding:2px 10px;margin:8px 0;color:var(--muted);font-size:14px}
.badge{font-size:12px;border-radius:6px;padding:1px 8px;margin-left:6px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.no{background:var(--chip);color:var(--muted)}
.score{font-size:20px;font-weight:700}
.flash{display:flex;justify-content:center}
.deck{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.fc{perspective:900px;height:320px;cursor:pointer}
.fc .in{position:relative;width:100%;height:320px;display:grid;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{grid-area:1/1;height:320px;overflow-y:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:var(--panel);box-shadow:var(--shadow);overflow-wrap:anywhere;line-height:1.7}
.fc .f{display:flex;text-align:center;font-weight:600;font-size:18px}
.fc .f .ftext{margin:auto}
.fc .b{transform:rotateY(180deg);font-size:15px;display:flex;text-align:center}
.fc .b .btext{margin:auto;width:100%}
.fc .b .quote{text-align:left}
.fc:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:14px}
.deck-meta{display:flex;justify-content:center;color:var(--muted);font-size:14px}
.deck-bar{height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.deck-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.deck-nav{display:flex;gap:10px;justify-content:space-between}
.deck-nav .btn{min-width:120px}
@media (max-width:640px){.deck-nav .btn{flex:1;min-width:0}}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none} .deck-bar i{transition:none}}
.viewer{position:sticky;top:80px;height:calc(100vh - 110px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.viewer .bar{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.viewer .bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vhide{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:2px 10px;font-size:13px}
.viewer.hide{height:auto}
.viewer.hide iframe{display:none}
.viewer iframe{flex:1;border:0;width:100%}
.err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="logo">Lecture<span>Lens</span></div>
  <div class="file" id="fileName"></div>
  <div class="seg" id="langSeg"><button data-l="th" class="on">ไทย</button><button data-l="en">EN</button></div>
  <button class="btn ghost" id="newBtn" hidden>อัปโหลดใหม่</button>
</header>
<main>
  <section id="uploadView">
    <div class="drop" id="drop">
  <h1 id="uploadTitle">อ่านสไลด์ทั้งเทอม<br>ให้จบในไม่กี่นาที</h1>
  <p id="uploadSub">อัปโหลดสไลด์เลกเชอร์ แล้วรับสรุปสองภาษา ควิซ และแฟลชการ์ด<br>
     ทุกคำถามบอกเลขหน้าในสไลด์ เปิดดูต้นฉบับได้ทันที</p>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
  <button class="btn" id="pickBtn">อัปโหลดสไลด์ (PDF)</button>
  <div class="muted" id="dragHint" style="margin-top:10px;font-size:14px">หรือลากไฟล์มาวางตรงนี้ · รองรับสไลด์ไทย อังกฤษ และไทยปนอังกฤษ</div>
  <div class="status" id="status"></div>
  </div>
  </section>

  <section id="studyView" hidden>
    <div class="work">
      <div>
        <div class="tabs" id="tabs">
          <button data-t="summary" class="on">สรุป</button>
          <button data-t="quiz">ควิซ</button>
          <button data-t="cards">แฟลชการ์ด</button>
        </div>
        <div id="pane"></div>
      </div>
      <aside class="viewer" id="viewer">
        <div class="bar"><span id="viewerBar">สไลด์ · คลิกเลขหน้า (p.) เพื่อเปิดหน้านั้น</span><button class="vhide" id="viewerHide">ซ่อน</button></div>
        <iframe id="pdf" title="Lecture slides"></iframe>
      </aside>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const state = { id:null, filename:"", lang:"th", tab:"summary", summary:null, quiz:{}, cards:{}, answers:{}, quizOpts:{} };
const T = {
  th:{overview:"ภาพรวม", terms:"คำสำคัญ", makeQuiz:"สร้างควิซ", numQ:"จำนวนข้อ", diffQ:"ความยาก", diff_easy:"ง่าย", diff_medium:"กลาง", diff_hard:"ยาก", newQuiz:"สร้างชุดใหม่", makeCards:"สร้างแฟลชการ์ด",
      loadingSum:"กำลังสรุปเนื้อหา…", loadingQuiz:"กำลังออกข้อสอบ…", loadingCards:"กำลังทำแฟลชการ์ด…",
      verified:"✓ ตรวจกับสไลด์แล้ว", unverified:"ยังไม่ยืนยัน", score:"คะแนน", retry:"ฝึกเฉพาะเรื่องที่ตอบผิด",
      flipHint:"คลิกการ์ดเพื่อพลิก", evidence:"จากสไลด์", why:"เหตุผล", hideViewer:"ซ่อน", showViewer:"แสดง",
      uploadTitle:"อ่านสไลด์ทั้งเทอม<br>ให้จบในไม่กี่นาที",
      uploadSub:"อัปโหลดสไลด์เลกเชอร์ แล้วรับสรุปสองภาษา ควิซ และแฟลชการ์ด<br>ทุกคำถามบอกเลขหน้าในสไลด์ เปิดดูต้นฉบับได้ทันที",
      pickFile:"อัปโหลดสไลด์ (PDF)", dragHint:"หรือลากไฟล์มาวางตรงนี้ · รองรับสไลด์ไทย อังกฤษ และไทยปนอังกฤษ", newUpload:"อัปโหลดใหม่",
      tabSummary:"สรุป", tabQuiz:"ควิซ", tabCards:"แฟลชการ์ด",
      viewerHint:"สไลด์ · คลิกเลขหน้า (p.) เพื่อเปิดหน้านั้น",
      reading:"กำลังอ่านสไลด์ทุกหน้า… (ประมาณ 30–90 วินาที)", uploadFail:"อัปโหลดไม่สำเร็จ"},
  en:{overview:"Overview", terms:"Key terms", makeQuiz:"Generate quiz", numQ:"Questions", diffQ:"Difficulty", diff_easy:"Easy", diff_medium:"Medium", diff_hard:"Hard", newQuiz:"New set", makeCards:"Generate flashcards",
      loadingSum:"Summarizing…", loadingQuiz:"Writing questions…", loadingCards:"Making flashcards…",
      verified:"✓ checked against slides", unverified:"unverified", score:"Score", retry:"Practice my mistakes",
      flipHint:"Click a card to flip", evidence:"From the slides", why:"Why", hideViewer:"Hide", showViewer:"Show",
      uploadTitle:"Read a whole semester of slides<br>in just a few minutes",
      uploadSub:"Upload lecture slides and get a bilingual summary, quiz and flashcards<br>Every question cites its slide page — open the source instantly",
      pickFile:"Upload slides (PDF)", dragHint:"or drop your file here · supports Thai, English and mixed slides", newUpload:"New upload",
      tabSummary:"Summary", tabQuiz:"Quiz", tabCards:"Flashcards",
      viewerHint:"Slides · click a page number (p.) to open it",
      reading:"Reading every slide… (about 30–90 seconds)", uploadFail:"Upload failed"}
};
const t = k => T[state.lang][k];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chip = p => `<button class="chip" data-page="${p}">p.${p}</button>`;
const loading = msg => `<div class="card muted"><span class="spin"></span>${esc(msg)}</div>`;

async function api(path, opts={}){
  const r = await fetch(path, opts);
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail }catch{}; throw new Error(d || r.statusText); }
  return r.json();
}
function save(){ try{ localStorage.setItem("ll_last", JSON.stringify({id:state.id, filename:state.filename})) }catch{} }

// ---------- upload ----------
const drop = $("#drop");
$("#pickBtn").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => e.target.files[0] && upload(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };

async function upload(file){
  const st = $("#status");
  st.innerHTML = `<span class="spin"></span>${esc(t("reading"))}`;
  $("#pickBtn").disabled = true;
  const fd = new FormData(); fd.append("file", file);
  try{
    const r = await api("/api/lectures", {method:"POST", body:fd});
    openLecture(r.id, r.filename);
  }catch(e){ st.innerHTML = `<span class="err">${esc(t("uploadFail"))}: ${esc(e.message)}</span>`; }
  finally{ $("#pickBtn").disabled = false; }
}

function openLecture(id, filename){
  Object.assign(state, {id, filename, summary:null, quiz:{}, cards:{}, answers:{}});
  save();
  $("#fileName").textContent = filename;
  $("#uploadView").hidden = true; $("#studyView").hidden = false; $("#newBtn").hidden = false;
  $("#pdf").src = `/api/lectures/${id}/pdf`;
  $("#viewer").classList.remove("hide");
  render();
}
$("#newBtn").onclick = () => { $("#uploadView").hidden = false; $("#studyView").hidden = true; $("#newBtn").hidden = true; $("#status").textContent=""; $("#fileName").textContent=""; };

// ---------- page viewer ----------
function goPage(p){
  const v = $("#viewer"); v.classList.remove("hide"); $("#viewerHide").textContent = t("hideViewer");
  const f = $("#pdf"); f.src = "about:blank";
  setTimeout(() => { f.src = `/api/lectures/${state.id}/pdf#page=${p}`; }, 30);
  $("#viewerBar").textContent = `${state.filename} · p.${p}`;
}
$("#viewerHide").onclick = () => { const v = $("#viewer"); v.classList.toggle("hide");
  $("#viewerHide").textContent = v.classList.contains("hide") ? t("showViewer") : t("hideViewer"); };
document.addEventListener("click", e => {
  const c = e.target.closest("[data-page]"); if(c){ e.stopPropagation(); goPage(+c.dataset.page); }
});

// ---------- tabs & language ----------
$("#tabs").onclick = e => { const b=e.target.closest("button"); if(!b) return;
  state.tab = b.dataset.t; [...$("#tabs").children].forEach(x=>x.classList.toggle("on", x===b)); render(); };
$("#langSeg").onclick = e => { const b=e.target.closest("button"); if(!b) return;
  state.lang = b.dataset.l; [...$("#langSeg").children].forEach(x=>x.classList.toggle("on", x===b)); applyChrome(); render(); };

function applyChrome(){
  document.documentElement.lang = state.lang;
  $("#uploadTitle").innerHTML = t("uploadTitle");
  $("#uploadSub").innerHTML = t("uploadSub");
  $("#pickBtn").textContent = t("pickFile");
  $("#dragHint").textContent = t("dragHint");
  $("#newBtn").textContent = t("newUpload");
  $("#tabs [data-t=summary]").textContent = t("tabSummary");
  $("#tabs [data-t=quiz]").textContent = t("tabQuiz");
  $("#tabs [data-t=cards]").textContent = t("tabCards");
  const vb = $("#viewerBar");
  if(vb && (vb.textContent===T.th.viewerHint || vb.textContent===T.en.viewerHint)) vb.textContent = t("viewerHint");
  const hb = $("#viewerHide");
  if(hb) hb.textContent = $("#viewer").classList.contains("hide") ? t("showViewer") : t("hideViewer");
}
function render(){
  if(!state.id) return;
  applyChrome();
  ({summary:renderSummary, quiz:renderQuiz, cards:renderCards})[state.tab]();
}

// ---------- summary ----------
async function renderSummary(){
  const pane = $("#pane");
  if(!state.summary){
    pane.innerHTML = loading(t("loadingSum"));
    try{ state.summary = await api(`/api/lectures/${state.id}/summary`); }
    catch(e){ pane.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
    if(state.tab!=="summary") return;
  }
  const s = state.summary, L = state.lang;
  pane.innerHTML = `
    <div class="card"><h3>${t("overview")}</h3><div>${esc(s["overview_"+L])}</div></div>
    ${s.sections.map(sec => `
      <div class="card"><h3>${esc(sec["title_"+L])}</h3>
        <div>${sec.pages.map(chip).join("")}</div>
        <ul>${sec["points_"+L].map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`).join("")}
    ${s.key_terms.length ? `<div class="card"><h3>${t("terms")}</h3><div class="tscroll"><table>
      ${s.key_terms.map(k=>`<tr><td>${esc(k.term)}</td><td>${esc(k["meaning_"+L])}</td><td>${chip(k.page)}</td></tr>`).join("")}
    </table></div></div>` : ""}`;
}

// ---------- quiz ----------
async function makeQuiz(focus=[]){
  const L = state.lang;
  const o = state.quizOpts[L] || {n:10, difficulty:"medium"};
  $("#pane").innerHTML = loading(t("loadingQuiz"));
  try{
    state.quiz[L] = await api(`/api/lectures/${state.id}/quiz`, {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({lang:L, n: focus.length?5:o.n, difficulty:o.difficulty, focus_pages:focus})});
    state.answers[L] = {};
  }catch(e){ $("#pane").innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  if(state.tab==="quiz") renderQuiz();
}
function renderQuizOpts(){
  const L = state.lang, pane = $("#pane");
  const o = state.quizOpts[L] || (state.quizOpts[L] = {n:10, difficulty:"medium"});
  pane.innerHTML = `<div class="card">
    <div class="toolbar"><span class="muted">${t("numQ")}</span><span class="seg" id="nSeg">${[10,20,30].map(n=>`<button data-n="${n}" class="${n===o.n?"on":""}">${n}</button>`).join("")}</span></div>
    <div class="toolbar"><span class="muted">${t("diffQ")}</span><span class="seg" id="dSeg">${["easy","medium","hard"].map(d=>`<button data-d="${d}" class="${d===o.difficulty?"on":""}">${t("diff_"+d)}</button>`).join("")}</span></div>
    <button class="btn" id="mk">${t("makeQuiz")}</button></div>`;
  pane.querySelectorAll("#nSeg button").forEach(b => b.onclick = () => { o.n = +b.dataset.n; renderQuizOpts(); });
  pane.querySelectorAll("#dSeg button").forEach(b => b.onclick = () => { o.difficulty = b.dataset.d; renderQuizOpts(); });
  $("#mk").onclick = () => makeQuiz();
}
function renderQuiz(){
  const L = state.lang, q = state.quiz[L], pane = $("#pane");
  if(!q){ renderQuizOpts(); return; }
  const ans = state.answers[L];
  const done = Object.keys(ans).length, total = q.questions.length;
  const correct = q.questions.filter((x,i)=>ans[i]===x.answer_index).length;
  const wrongPages = [...new Set(q.questions.filter((x,i)=>i in ans && ans[i]!==x.answer_index).map(x=>x.source_page))];
  pane.innerHTML = `
    <div class="toolbar">
      <span class="score">${t("score")} ${correct}/${total}</span>
      <span class="muted">${q.stats.verified}/${q.stats.total} ${t("verified")}</span>
      <span style="flex:1"></span>
      ${done===total && wrongPages.length ? `<button class="btn" id="retry">${t("retry")}</button>` : ""}
      <button class="btn ghost" id="mk">${t("newQuiz")}</button>
    </div>
    ${q.questions.map((x,i)=>{
      const a = ans[i], locked = a!==undefined;
      return `<div class="card"><div class="q">${i+1}. ${esc(x.question)}</div>
        <div class="choices">${x.choices.map((c,j)=>{
          const cls = locked ? (j===x.answer_index?"right":(j===a?"wrong":"")) : "";
          return `<button class="choice ${cls}" data-q="${i}" data-c="${j}" ${locked?"disabled":""}>${"ABCD"[j]}. ${esc(c)}</button>`}).join("")}</div>
        ${locked ? `<div class="explain"><b>${t("why")}:</b> ${esc(x.explanation)}
          <div class="quote">${t("evidence")} ${chip(x.source_page)}<span class="badge ${x.verified?"ok":"no"}">${x.verified?t("verified"):t("unverified")}</span><br>“${esc(x.evidence)}”</div></div>` : ""}
      </div>`}).join("")}`;
  $("#mk").onclick = () => { state.quiz[L] = null; state.answers[L] = {}; renderQuiz(); };
  if($("#retry")) $("#retry").onclick = () => makeQuiz(wrongPages);
  pane.querySelectorAll(".choice").forEach(b => b.onclick = () => { ans[+b.dataset.q] = +b.dataset.c; renderQuiz(); });
}

// ---------- flashcards ----------
async function renderCards(){
  const L = state.lang, pane = $("#pane"), c = state.cards[L];
  if(!c){
    pane.innerHTML = `<div class="card"><button class="btn" id="mk">${t("makeCards")}</button></div>`;
    $("#mk").onclick = async () => {
      pane.innerHTML = loading(t("loadingCards"));
      try{ state.cards[L] = await api(`/api/lectures/${state.id}/flashcards`, {method:"POST",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify({lang:L, n:15})}); }
      catch(e){ pane.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
      if(state.tab==="cards") renderCards();
    };
    return;
  }
  renderCards.pos = renderCards.pos || {};
  renderCards.seen = renderCards.seen || {};
  let idx = renderCards.pos[L] || 0;
  if(renderCards.seen[L] !== c){ renderCards.seen[L] = c; idx = 0; }
  if(idx < 0 || idx >= c.cards.length) idx = 0;
  const prevLabel = L === "th" ? "← ก่อนหน้า" : "← Previous";
  const nextLabel = L === "th" ? "ถัดไป →" : "Next →";
  const focusCard = () => { const el = pane.querySelector(".fc"); if(el) el.focus({preventScroll:true}); };
  function draw(i){
    renderCards.pos[L] = i;
    const x = c.cards[i];
    const pct = ((i+1) / c.cards.length * 100).toFixed(1);
    pane.innerHTML = `<div class="toolbar muted">${t("flipHint")} · ${c.stats.verified}/${c.stats.total} ${t("verified")}</div>
      <div class="flash"><div class="deck">
        <div class="fc" role="button" tabindex="0" aria-label="${i+1} / ${c.cards.length}"><div class="in">
          <div class="f"><div class="ftext">${esc(x.front)}</div></div>
          <div class="b"><div class="btext"><div>${esc(x.back)}</div><div class="quote">${chip(x.source_page)}${x.verified?`<span class="badge ok">✓</span>`:""}<br>“${esc(x.evidence)}”</div></div></div>
        </div></div>
        <div class="deck-meta"><span>${i+1} / ${c.cards.length}</span></div>
        <div class="deck-bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
        <div class="deck-nav">
          <button class="btn ghost" id="deckPrev"${i===0?" disabled":""}>${prevLabel}</button>
          <button class="btn" id="deckNext"${i===c.cards.length-1?" disabled":""}>${nextLabel}</button>
        </div>
      </div></div>`;
    const card = pane.querySelector(".fc");
    card.onclick = e => { if(e.target.closest("[data-page]")) return; card.classList.toggle("flip"); };
    card.onkeydown = e => {
      if(e.key === " " || e.key === "Enter"){ e.preventDefault(); card.classList.toggle("flip"); }
      else if(e.key === "ArrowLeft"){ e.preventDefault(); if(i > 0){ draw(i-1); focusCard(); } }
      else if(e.key === "ArrowRight"){ e.preventDefault(); if(i < c.cards.length-1){ draw(i+1); focusCard(); } }
    };
    pane.querySelector("#deckPrev").onclick = () => { if(i > 0){ draw(i-1); focusCard(); } };
    pane.querySelector("#deckNext").onclick = () => { if(i < c.cards.length-1){ draw(i+1); focusCard(); } };
  }
  draw(idx);
  document.onkeydown = e => {
    if(state.tab !== "cards") return;
    const cur = state.cards[state.lang];
    if(!cur) return;
    if(e.target && e.target.closest && e.target.closest(".fc")) return;
    const j = renderCards.pos[state.lang] || 0;
    if(e.key === "ArrowLeft" && j > 0){ e.preventDefault(); renderCards.pos[state.lang] = j-1; renderCards(); focusCard(); }
    else if(e.key === "ArrowRight" && j < cur.cards.length-1){ e.preventDefault(); renderCards.pos[state.lang] = j+1; renderCards(); focusCard(); }
  };
}

// ---------- restore last lecture ----------
(async () => {
  let last=null; try{ last = JSON.parse(localStorage.getItem("ll_last")||"null") }catch{}
  if(last?.id){ try{ await api(`/api/lectures/${last.id}/pages/1`); openLecture(last.id, last.filename); }catch{} }
})();
</script>
